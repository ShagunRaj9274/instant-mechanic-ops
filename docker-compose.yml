services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instant_mechanic
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d instant_mechanic']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/instant_mechanic
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGINS: http://localhost:3000
      SIMULATOR_ENABLED: 'true'
    ports:
      - '4000:4000'
    restart: unless-stopped

volumes:
  db-data:
